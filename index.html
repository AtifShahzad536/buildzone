<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="shortcut icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FFFFFF" />
    <title>BuildZone Technology — Software & AI Product Engineering</title>
    <meta name="description" content="BuildZone delivers custom enterprise software, scalable cloud systems, AI automation, and digital product engineering." />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://buildzonetechnology.com/" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://buildzonetechnology.com/" />
    <meta property="og:site_name" content="BuildZone Technology" />
    <meta property="og:title" content="BuildZone Technology — Software & AI Product Engineering" />
    <meta property="og:description" content="BuildZone delivers custom enterprise software, scalable cloud systems, AI automation, and digital product engineering." />
    <meta property="og:image" content="https://buildzonetechnology.com/logo.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://buildzonetechnology.com/" />
    <meta name="twitter:title" content="BuildZone Technology — Software & AI Product Engineering" />
    <meta name="twitter:description" content="BuildZone delivers custom enterprise software, scalable cloud systems, AI automation, and digital product engineering." />
    <meta name="twitter:image" content="https://buildzonetechnology.com/logo.png" />

    <!-- Preload Critical Above-The-Fold Assets for Instant LCP Discovery -->
    <link rel="preload" as="image" href="/logo.png" fetchpriority="high" />
    <link rel="preload" as="image" href="/LOGO%20TEXT.png" fetchpriority="high" />

    <!-- Google Fonts Optimization: Plus Jakarta Sans, Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" />

    <!-- Structured Data (Schema.org) for Google Search Console & Knowledge Graph -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://buildzonetechnology.com/#organization",
          "name": "BuildZone Technology",
          "url": "https://buildzonetechnology.com/",
          "logo": {
            "@type": "ImageObject",
            "url": "https://buildzonetechnology.com/logo.png",
            "caption": "BuildZone Technology"
          },
          "sameAs": [
            "https://linkedin.com/company/buildzone-tech",
            "https://github.com/buildzone-tech",
            "https://twitter.com/buildzone_tech"
          ],
          "contactPoint": {
            "@type": "ContactPoint",
            "telephone": "+1-555-382-9201",
            "contactType": "customer service",
            "availableLanguage": ["English"]
          }
        },
        {
          "@type": "WebSite",
          "@id": "https://buildzonetechnology.com/#website",
          "url": "https://buildzonetechnology.com/",
          "name": "BuildZone Technology",
          "description": "Custom enterprise software, scalable cloud systems, and AI automation engineering.",
          "publisher": {
            "@id": "https://buildzonetechnology.com/#organization"
          },
          "inLanguage": "en-US"
        }
      ]
    }
    </script>

  </head>
  <body class="bg-[#F8FAFC] text-slate-800 font-sans antialiased selection:bg-blue-500/20 selection:text-[#0066FF] overflow-x-hidden min-h-screen">
    <div id="root" class="min-h-screen"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
